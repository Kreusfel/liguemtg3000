<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1410">
<title>La Jurande — ligue MTG</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="mana-strip"></div>
<header class="top">
  <div class="wordmark">La Jurande</div>
  <div class="tagline">ligue Magic</div>
</header>

<nav role="tablist" id="nav">
  <button role="tab" aria-selected="true"  data-p="classement">Classement</button>
  <button role="tab" aria-selected="false" data-p="historique">Historique</button>
  <button role="tab" aria-selected="false" data-p="joueurs">Joueurs</button>
  <button role="tab" aria-selected="false" data-p="decks">Decks</button>
  <button role="tab" aria-selected="false" data-p="rivalites">Rivalités</button>
  <button role="tab" aria-selected="false" data-p="saisie">Saisie <span class="badge" id="badge-saisie"></span></button>
  <button role="tab" aria-selected="false" data-p="reglages">Réglages</button>
</nav>

<main>
  <section id="view"></section>
</main>

<footer class="pied">La Jurande — ligue Magic · classements recalculés côté navigateur · données publiques sur GitHub</footer>

<div class="toast" id="toast"></div>

<script type="module" src="js/main.js"></script>
<script>
// Filet de secours : si l'app ne s'est pas initialisée (module non chargé,
// cache obsolète…), on affiche un message avec un bouton de récupération
// plutôt qu'une page blanche muette.
addEventListener('load', function () {
  setTimeout(function () {
    if (window.__appReady) return;
    var m = document.querySelector('main');
    if (m) m.innerHTML = '<div style="max-width:640px;margin:24px auto;padding:18px 20px;'
      + 'background:#fff6ee;border:2px solid #ff8a3d;border-radius:16px;'
      + 'font-family:Nunito,system-ui,sans-serif;color:#2a2140">'
      + '<b style="font-family:Fredoka,sans-serif;font-size:18px">Le chargement a échoué.</b>'
      + '<p style="margin:8px 0 14px">Le cache est probablement obsolète après une mise à jour.</p>'
      + '<button id="jr-fix" style="font:600 14px Fredoka,sans-serif;cursor:pointer;border:none;'
      + 'background:#7a4bd0;color:#fff;padding:10px 18px;border-radius:999px">Vider le cache et recharger</button>'
      + '</div>';
    var b = document.getElementById('jr-fix');
    if (b) b.onclick = async function () {
      try {
        if (navigator.serviceWorker) {
          var regs = await navigator.serviceWorker.getRegistrations();
          for (var i = 0; i < regs.length; i++) await regs[i].unregister();
        }
        if (window.caches) {
          var keys = await caches.keys();
          for (var k = 0; k < keys.length; k++) await caches.delete(keys[k]);
        }
      } catch (e) { /* on recharge quand même */ }
      location.reload();
    };
  }, 4000);
});
</script>
</body>
</html>
